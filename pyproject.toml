[project]
name = "mcp-multi-tool-agent"
version = "0.1.0"
description = "An extensible LLM + LangGraph + MCP agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "langchain-mcp-adapters>=0.3.2,<0.4",
    "langgraph>=1.0,<2",
    "mcp>=1.12,<2",
    "pydantic-settings>=2.10,<3",
    "python-dotenv>=1.1,<2",
    "tzdata>=2025.2",
    "sqlalchemy>=2.0,<3",
    "pymysql[rsa]>=1.1,<2",
    "sqlglot>=26,<31",
    "ddgs>=9.16,<10",
    "httpx>=0.28,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[project.scripts]
mcp-agent = "mcp_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
